site_name: Agent Sandbox Java SDK
site_description: Windows、Linux 与 macOS 原生进程沙箱实现指南
site_author: Agent Sandbox SDK Contributors
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

nav:
  - 首页: index.md
  - 核心设计:
      - 总体架构: architecture.md
      - 策略模型: policy-model.md
  - 平台实现:
      - Windows: platforms/windows.md
      - Linux 与 WSL2: platforms/linux.md
      - macOS: platforms/macos.md
  - 安全:
      - 安全边界与威胁模型: security-boundaries.md
      - Security baseline（English）: SECURITY.md
  - 参考:
      - 术语表: glossary.md
      - SDK 集成: SDK.md
      - 制品发布: PUBLISHING.md
      - 文档站点开发: site-development.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang:
        - zh
        - en

extra_css:
  - stylesheets/extra.css

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

copyright: Copyright &copy; Agent Sandbox SDK Contributors
