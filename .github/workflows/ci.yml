name: agent-sandbox-sdk

on:
  push:
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Build documentation
        run: python -m mkdocs build --strict
      - name: Verify native evidence gate
        run: python -m unittest discover -s .github/scripts -p 'test_windows_native_evidence.py'

  test:
    strategy:
      fail-fast: false
      matrix:
        # Temurin 8 is not published for the arm64 architecture behind macos-latest.
        # Use a host with unprivileged user namespaces available to bubblewrap.
        os: [ubuntu-22.04, macos-15-intel, windows-latest]
        java: ['8', '17', '21']
        include:
          - os: macos-15
            java: '17'
          - os: macos-15
            java: '21'
    runs-on: ${{ matrix.os }}
    env:
      SANDBOX_RUN_PLATFORM_INTEGRATION: '1'
      SANDBOX_RUN_LIFECYCLE_INTEGRATION: '1'
      SANDBOX_RUN_OUTPUT_INTEGRATION: '1'
      SANDBOX_RUN_READINESS_INTEGRATION: '1'
      SANDBOX_RUN_ENVIRONMENT_INTEGRATION: '1'
      SANDBOX_RUN_RESOURCE_INTEGRATION: '1'
      SANDBOX_SYNTHETIC_PARENT_SECRET: 'synthetic-parent-secret-must-not-inherit'
      # Modern macOS admission failures are failures, never successful skips.
      SANDBOX_MACOS_STRICT_ACCEPTANCE: ${{ startsWith(matrix.os, 'macos-') && matrix.java != '8' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Verify Linux namespace availability
        if: runner.os == 'Linux'
        run: bwrap --unshare-user --unshare-pid --ro-bind / / --proc /proc --dev /dev -- /bin/true
      - name: Test Linux and macOS
        if: runner.os != 'Windows'
        run: mvn --batch-mode --no-transfer-progress install
      - name: Build Windows distribution
        if: runner.os == 'Windows'
        run: mvn --batch-mode --no-transfer-progress -DskipTests install
      - name: Install production Windows sandbox
        if: runner.os == 'Windows'
        shell: pwsh
        run: java -jar target/agent-sandbox-sdk-1.0.0-SNAPSHOT-all.jar setup-windows
      - name: Compile bounded Windows resource probe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $source = (Resolve-Path '.github/scripts/resource-probe.cs').Path
          $destination = Join-Path (Get-Location) 'target/resource-probe.exe'
          & $compiler '/nologo' '/target:exe' '/platform:x64' "/out:$destination" $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test production Windows sandbox
        if: runner.os == 'Windows'
        env:
          SANDBOX_WINDOWS_PRODUCTION_TEST: '1'
          SECRET_TEST_VALUE: abc123
        run: mvn --batch-mode --no-transfer-progress test
      - name: Annotate Windows test failures
        if: runner.os == 'Windows' && failure()
        shell: pwsh
        run: |
          if (-not (Test-Path target/surefire-reports)) {
            Write-Output 'No JUnit reports: failure occurred before tests started.'
            exit 0
          }
          Get-ChildItem target/surefire-reports -Filter 'TEST-*.xml' | ForEach-Object {
            [xml]$report = Get-Content -LiteralPath $_.FullName -Raw
            foreach ($case in $report.SelectNodes('//testcase[failure or error]')) {
              $failure = $case.SelectSingleNode('failure|error')
              $message = "$($case.classname).$($case.name): $($failure.GetAttribute('message'))"
              if ($message.Length -gt 2000) { $message = $message.Substring(0, 2000) }
              $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error::$message"
            }
          }
      - name: Compile external SDK consumer
        run: mvn --batch-mode --no-transfer-progress -f examples/sdk-consumer/pom.xml clean package
      - uses: actions/setup-python@v6
        if: always()
        with:
          python-version: '3.12'
      - name: Compile public documentation examples with Java 8 APIs
        run: python .github/scripts/check-doc-examples.py
      - name: Summarize runtime versions and test counts
        if: always()
        run: python .github/scripts/collect-test-evidence.py
      - name: Require successful production Windows native methods
        if: runner.os == 'Windows' && always()
        run: python .github/scripts/check-windows-native-evidence.py --backend production
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ matrix.os }}-jdk-${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/backend-evidence/
            target/test-evidence.json
            target/native-acceptance.json
      - name: Uninstall production Windows sandbox
        if: runner.os == 'Windows' && always()
        shell: pwsh
        run: |
          if (Test-Path target/agent-sandbox-sdk-1.0.0-SNAPSHOT-all.jar) {
            java -jar target/agent-sandbox-sdk-1.0.0-SNAPSHOT-all.jar uninstall-windows
          }

  windows-default:
    name: Windows standard-user default backend (JDK ${{ matrix.java }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '17', '21']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run default backend acceptance as a temporary standard user
        shell: pwsh
        run: ./.github/scripts/run-windows-default-tests.ps1
      - name: Require successful default Windows native methods
        if: always()
        run: python .github/scripts/check-windows-native-evidence.py --backend default --directory target/windows-default
      - name: Upload default backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-default-jdk-${{ matrix.java }}
          path: target/windows-default/
