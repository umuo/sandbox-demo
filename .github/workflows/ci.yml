name: agent-sandbox-sdk

on:
  push:
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Build documentation
        run: python -m mkdocs build --strict

  test:
    strategy:
      fail-fast: false
      matrix:
        # Temurin 8 is not published for the arm64 architecture behind macos-latest.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SANDBOX_RUN_PLATFORM_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Test Linux and macOS
        if: runner.os != 'Windows'
        run: mvn --batch-mode --no-transfer-progress install
      - name: Build Windows distribution
        if: runner.os == 'Windows'
        run: mvn --batch-mode --no-transfer-progress -DskipTests install
      - name: Install production Windows sandbox
        if: runner.os == 'Windows'
        shell: pwsh
        run: java -jar target/agent-sandbox-sdk-1.0.0-SNAPSHOT-all.jar setup-windows
      - name: Test production Windows sandbox
        if: runner.os == 'Windows'
        env:
          SANDBOX_WINDOWS_PRODUCTION_TEST: '1'
          SECRET_TEST_VALUE: abc123
        run: mvn --batch-mode --no-transfer-progress test
      - name: Compile external SDK consumer
        run: mvn --batch-mode --no-transfer-progress -f examples/sdk-consumer/pom.xml clean package
      - name: Uninstall production Windows sandbox
        if: runner.os == 'Windows' && always()
        shell: pwsh
        run: |
          if (Test-Path target/agent-sandbox-sdk-1.0.0-SNAPSHOT-all.jar) {
            java -jar target/agent-sandbox-sdk-1.0.0-SNAPSHOT-all.jar uninstall-windows
          }
